[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter"
version = "0.1.0"
description = "对 OpenAI 兼容网关执行九板块「掺水」自检的离线工具（零第三方依赖）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# 零第三方依赖：仅使用 Python 标准库
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Cocos666a/arbiter"
Issues = "https://github.com/Cocos666a/arbiter/issues"

[project.scripts]
arbiter = "arbiter.cli:main"

[tool.setuptools]
packages = ["arbiter", "arbiter.sections"]

[tool.setuptools.package-data]
arbiter = ["templates/*.tpl"]
